<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KT Distiller</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("kt:theme")); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<a class="sr" href="#view">Skip to content</a>
<header class="topbar">
  <a class="brand" href="#/"><span id="logo"></span>KT Distiller</a>
  <nav aria-label="Main"><a id="navLib" href="#/" aria-current="page">Library</a></nav>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme" aria-label="Switch theme"></button>
</header>
<div id="view" tabindex="-1"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
